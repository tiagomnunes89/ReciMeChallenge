name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'

jobs:
  detekt:
    name: Detekt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Detekt
        run: ./gradlew detekt --stacktrace

      - name: Upload Detekt reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: '**/build/reports/detekt/'
          if-no-files-found: ignore

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and generate coverage report
        run: ./gradlew testDebugUnitTest :app:koverHtmlReportDebug --stacktrace

      - name: Check coverage threshold (advisory)
        continue-on-error: true
        run: ./gradlew :app:koverVerifyDebug --stacktrace

      - name: Build minified release bundle and benchmark APK (unsigned)
        run: ./gradlew :app:bundleRelease :benchmark:assemble --stacktrace

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/build/reports/tests/testDebugUnitTest/'
          if-no-files-found: ignore

      - name: Upload ViewModel coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: viewmodel-coverage
          path: app/build/reports/kover/
          if-no-files-found: ignore

  quality-gate:
    name: Quality gate
    if: always()
    needs: [detekt, unit-tests, ui-tests]
    runs-on: ubuntu-latest
    steps:
      - name: Require all quality checks to pass
        env:
          DETEKT_RESULT: ${{ needs.detekt.result }}
          UNIT_TESTS_RESULT: ${{ needs.unit-tests.result }}
          UI_TESTS_RESULT: ${{ needs.ui-tests.result }}
        run: |
          test "$DETEKT_RESULT" = success
          test "$UNIT_TESTS_RESULT" = success
          test "$UI_TESTS_RESULT" = success

  ui-tests:
    name: UI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build app and instrumented test APKs
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Run instrumented UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_5
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -camera-back none -camera-front none
          force-avd-creation: true
          emulator-boot-timeout: 600
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload UI-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-reports
          path: |
            **/build/reports/androidTests/connected/
            **/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore

  change-review:
    name: Change review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate changed files and diff
        run: |
          git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

      - name: Generate review diff and changed-line map
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/skills/change-review/scripts/generate_diff.sh "${{ github.event.pull_request.number }}"

      - name: Upload review context
        uses: actions/upload-artifact@v4
        with:
          name: change-review-${{ github.event.pull_request.number }}
          path: |
            .review-tmp/pr_${{ github.event.pull_request.number }}.diff
            .review-tmp/pr_${{ github.event.pull_request.number }}_map.txt
            .review-tmp/pr_${{ github.event.pull_request.number }}_files.json
          if-no-files-found: error
