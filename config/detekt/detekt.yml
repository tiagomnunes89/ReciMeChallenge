complexity:
  CyclomaticComplexMethod:
    active: false
  LongMethod:
    active: false
  LongParameterList:
    active: false
  TooManyFunctions:
    active: false

naming:
  FunctionNaming:
    active: false
  MatchingDeclarationName:
    active: false

style:
  MagicNumber:
    active: true
    ignoreAnnotation: true
    ignoreCompanionObjectPropertyDeclaration: true
    ignoreConstantDeclaration: true
    ignorePropertyDeclaration: true
    ignoreNamedArgument: true
    ignoreExtensionFunctions: true
    ignoreEnums: true
    excludes: ['**/test/**', '**/testDebug/**', '**/androidTest/**']
  ReturnCount:
    active: false
  UnusedParameter:
    active: false
  UnusedPrivateMember:
    active: true
    ignoreAnnotated: ['Preview']
  WildcardImport:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false

formatting:
  ImportOrdering:
    active: true
    layout: '*'
  MaximumLineLength:
    active: true
    maxLineLength: 120
  Wrapping:
    active: false
